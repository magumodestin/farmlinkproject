<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password</title>
    <link rel="stylesheet" href="forgotpass.css" />
    <link rel="stylesheet" href="reset-flow.css" />
  </head>
  <body>
    <div class="page-wrap">
      <h1 class="heading1">Forgot Password</h1>
      <div class="form-card">
        <p class="subtext">
          Enter your email and we'll send you a verification code.
        </p>
        <form id="forgotForm">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter Email address"
            autocomplete="email"
            required
          />
          <button type="submit" class="reset-btn">Send Code</button>
        </form>
        <div
          id="forgotFeedback"
          class="reset-feedback"
          style="display: none"
        ></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="forgotpass.js"></script>
  </body>
</html>
