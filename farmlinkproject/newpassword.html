<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Password</title>
    <link rel="stylesheet" href="forgotpass.css" />
    <link rel="stylesheet" href="reset-flow.css" />
  </head>
  <body>
    <div class="page-wrap">
      <h1 class="heading1">Set New Password</h1>
      <div class="form-card">
        <p class="subtext">Choose a new password for your FarmLink account.</p>
        <form id="newPasswordForm">
          <div class="pw-field">
            <input type="password" id="newPassword" placeholder="New password"
                   autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="newPassword"
                    aria-label="Show/hide password">👁️</button>
          </div>
          <div class="pw-field">
            <input type="password" id="confirmNewPassword" placeholder="Confirm new password"
                   autocomplete="new-password" required />
            <button type="button" class="toggle-password" data-target="confirmNewPassword"
                    aria-label="Show/hide password">👁️</button>
          </div>
          <p id="pwHint" class="pw-hint"></p>
          <button type="submit" class="reset-btn" id="savePwBtn">Update Password</button>
        </form>
        <div id="newPwFeedback" class="reset-feedback" style="display: none"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="newpassword.js"></script>
  </body>
</html>
